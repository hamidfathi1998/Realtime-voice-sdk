name: Android SDK CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Core Unit Tests
        run: ./gradlew :sdk-core:test --stacktrace

      - name: Build Android Library Modules
        run: ./gradlew :sdk-audio:assembleDebug :sdk-transport:assembleDebug --stacktrace

      - name: Build Sample App
        run: ./gradlew :sample:assembleDebug --stacktrace
